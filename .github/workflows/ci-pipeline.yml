name: FastAPI CI Pipeline

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout Code
                uses: actions/checkout@v4

            -   name: Login to docker hub
                run: echo "${{ secrets.DOCKERHUBTOKEN }}" | docker login -u "${{ secrets.DOCKERHUBUSERNAME }}" --password-stdin

            -   name: Build docker image
                run:  docker build -t <docker login -u fahrezi23>/devops-project:latest .

            -   name: push to docker hub
                run:  docker push <docker login -u fahrezi23>/devops-project:latest